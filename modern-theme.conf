# modern-theme.conf -- a clean, modern look for this tmux build.
#
# Try it without installing anything:   ./try-theme.sh
#
# Palette
#   base     #0b1120   pane background (inactive panes are a touch darker)
#   navy     #0a1a4a   sidebar
#   text     #d6deeb
#   muted    #6b7896
#   accent   #7aa2ff   active things: current window, active pane, selection
#   accent2  #c3a6ff   prompts and highlights

# ---------------------------------------------------------------- basics
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g escape-time 10
set -g focus-events on

# ---------------------------------------- layout: bottom bar + sidebar
# Bottom bar: menu button and session on the left; detected serial devices
# (click one to open a console in a split) and the baud rate (click to
# change it) on the right.
set -g status on
set -g status-position bottom
set -g status-interval 2
set -g status-style "bg=#0f172b,fg=#d6deeb"
set -g serial-device-style "bg=#1b2a52,fg=#d6deeb"
set -g serial-device-active-style "bg=#2e7d5b,fg=#ffffff,bold"
set -g status-format[0] "#[range=user|menu]#[bg=#7aa2ff fg=#0a1a4a bold] ≡ #[norange]#[default] #[fg=#6b7896]#S  %H:%M#[align=right]#{serial_bar}  #[range=user|baud]#[bg=#c3a6ff fg=#0a1a4a bold] #{serial-baud} baud ▾ #[norange]#[default]"
set -g side-status right
set -g side-status-width 24
set -g side-status-style "bg=#0a1a4a,fg=#d6deeb"
setw -g window-status-style "fg=#9fb0d6"
setw -g window-status-current-style "bg=#7aa2ff,fg=#0a1a4a,bold"
setw -g window-status-activity-style "fg=#c3a6ff"
setw -g window-status-bell-style "fg=#ff7a93,bold"

# ------------------------------------------- panes: soft, rounded blocks
setw -g window-style "fg=#8a93a6,bg=#090e1a"
setw -g window-active-style "fg=#d6deeb,bg=#0b1120"
setw -g pane-border-lines rounded
setw -g pane-border-indicators colour
setw -g pane-border-style "fg=#1f2a44"
setw -g pane-active-border-style "fg=#7aa2ff"

# Header on top of every pane: running command + folder, like a block title.
setw -g pane-border-status top
# Serial consoles show the device and baud rate instead of the folder.
setw -g pane-border-format "#{?#{==:#{pane_current_command},picocom},#{?pane_active,#[bg=#2e7d5b fg=#ffffff bold],#[fg=#2e7d5b bold]} ⚡ #{pane_title} #[default]#[fg=#6b7896] C-a C-x to quit ,#{?pane_active,#[bg=#7aa2ff fg=#0a1a4a bold] #{pane_current_command} #[bg=default fg=#7aa2ff nobold] #{b:pane_current_path} ,#[fg=#6b7896] #{pane_current_command}  #{b:pane_current_path} }}#[default]"

# Thin scrollbar that only appears while scrolling.
setw -g pane-scrollbars auto-hide
setw -g pane-scrollbars-style "bg=#0b1120,fg=#3a4a72,width=1,pad=0"

# ------------------------------------------------ prompts, menus, modes
set -g message-style "bg=#141d33,fg=#c3a6ff"
set -g message-command-style "bg=#141d33,fg=#7aa2ff"
setw -g mode-style "bg=#2a3b6b,fg=#d6deeb"
set -g menu-border-lines rounded
set -g menu-style "bg=#0f172b,fg=#d6deeb"
set -g menu-selected-style "bg=#7aa2ff,fg=#0a1a4a,bold"
set -g menu-border-style "fg=#7aa2ff"

# ------------------------------------------------ handy, modern bindings
# Splits and new windows open in the current folder.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Command palette: Alt+Space (no prefix needed), or prefix + P.
# (##{ keeps the format for command-prompt instead of expanding it early.)
bind -n M-Space display-menu -x C -y C -T "#[align=centre fg=#c3a6ff bold] Command palette " \
  "New named session"   n { command-prompt -p "Session name:" { if -F "##{==:%%,}" { new-session } { new-session -s "%%" } } } \
  "Serial console"      s { choose-serial } \
  "Baud rate (#{serial-baud})" B { choose-serial -B } \
  "Switch session"      w { choose-tree -Zs } \
  "" \
  "Split right"         | { split-window -h -c "#{pane_current_path}" } \
  "Split down"          - { split-window -v -c "#{pane_current_path}" } \
  "New window"          c { new-window -c "#{pane_current_path}" } \
  "Zoom pane"           z { resize-pane -Z } \
  "" \
  "Rename window"       r { command-prompt -I "#W" { rename-window -- "%%" } } \
  "Rename session"      R { command-prompt -I "#S" { rename-session -- "%%" } } \
  "Toggle sidebar"      b { if -F "#{==:#{side-status},off}" { set side-status right } { set side-status off } } \
  "" \
  "Close pane"          x { kill-pane }
bind P send-keys -K M-Space

# ------------------------------------------------------ embedded / UART
# Baud rate menu: prefix + B, the palette, or click the baud chip in the
# bottom bar. Default is 115200.
bind B choose-serial -B

# Clicks on the bottom bar: a device opens/focuses its console, the baud chip
# opens the baud menu, the menu button opens the command palette.
bind -n MouseDown1Status {
  if -F "#{m:@*,#{mouse_status_range}}" {
    choose-serial -d "#{s/^@//:mouse_status_range}"
  } {
    if -F "#{==:#{mouse_status_range},baud}" { choose-serial -B } {
      if -F "#{==:#{mouse_status_range},menu}" { send-keys -K M-Space } { switch-client -t= }
    }
  }
}
