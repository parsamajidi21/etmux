# embedded-modern.tmux.conf -- example configuration for this tmux build:
# a modern look plus the embedded features (serial panes, boot detection,
# output triggers, open-location). Uses a Nerd Font for icons and the
# rounded "pill" ends; everything else works without one.
#
# Try it without installing anything:   ./try-theme.sh
#
# Palette
#   base     #0a0a0a   panes and bottom bar (black)
#   panel    #111111   side panel
#   surface  #1a1a1a   raised elements: menus, chips
#   line     #2a2a2a   borders and dividers
#   text     #d6deeb
#   muted    #6b7896
#   accent   #7aa2ff   current session/window, active pane
#   accent2  #c3a6ff   baud rate, prompts
#   ok       #5fd7a7   open serial consoles

# ---------------------------------------------------------------- basics
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g escape-time 10
set -g focus-events on

# ------------------------------------------------------------ bottom bar
# Left: palette button, session, window and folder. Right: baud rate
# (click to change), Tabs panel show/hide button and the time.
set -g status on
set -g status-position bottom
set -g status-interval 2
set -g status-style "bg=#0a0a0a,fg=#d6deeb"
set -g status-format[0] "#[range=user|menu]#[fg=#7aa2ff]#[bg=#7aa2ff fg=#0a0a0a bold] #[norange]#[bg=#1a1a1a fg=#d6deeb nobold] 󰆍 #S #[bg=#0a0a0a fg=#1a1a1a]#[default]  #[fg=#6b7896] #W  #[fg=#2a2a2a]│  #[fg=#6b7896] #{b:pane_current_path}#[align=right]#[range=user|baud]#[fg=#c3a6ff]#[bg=#c3a6ff fg=#0a0a0a bold]󰙜 #{serial-baud}#[nobold] baud ▾#[bg=#0a0a0a fg=#c3a6ff]#[norange]#[default]  #[range=user|panel]#[fg=#{?#{==:#{side-status},off},#6b7896,#7aa2ff}]#[norange]#[default]  #[fg=#6b7896] %H:%M "

# ------------------------------------------------------------ side panel (left)
# TABS: sessions (the current one lists its windows) and "+ New session".
# DEVICES: serial devices; click one to open a serial pane in a split
# (or jump to it if it is already open).
# FILES: the active pane's directory. Click any entry to open it as a
# pane in the current window: the terminal stays full height on the left
# and opened files stack on the right. Text files open in the editor,
# binary files with file-view-command (file + readelf for ELF, otherwise a
# hex dump), directories with a shell. Clicking an open file selects it.
# "set -g file-open-mode window" opens each in a tab instead.

# ----------------------------------------------------------------- panes
# Same background everywhere; inactive panes have dimmed text. Each pane
# has a header: a pill with the running command and the folder, or for a
# serial pane the device and baud rate (red when disconnected) and the
# boot stage with the time since the board was reset.
setw -g window-style "fg=#7c869c,bg=#0a0a0a"
setw -g window-active-style "fg=#d6deeb,bg=#0a0a0a"
setw -g pane-border-lines rounded
setw -g pane-border-indicators colour
setw -g pane-border-style "fg=#2a2a2a,bg=#0a0a0a"
setw -g pane-active-border-style "fg=#7aa2ff,bg=#0a0a0a"
setw -g pane-border-status top
setw -g pane-border-format "#{?pane_serial,#{?#{==:#{pane_serial_state},connected},#[fg=#5fd7a7]#[bg=#5fd7a7 fg=#0a0a0a bold] #{b:pane_serial_device} @ #{pane_serial_baud}#[bg=#0a0a0a fg=#5fd7a7 nobold],#[fg=#f7768e]#[bg=#f7768e fg=#0a0a0a bold] #{b:pane_serial_device} disconnected#[bg=#0a0a0a fg=#f7768e nobold]}#{?pane_boot_stage,#[fg=#c3a6ff]  #{pane_boot_stage} #{pane_boot_elapsed}s #[fg=#6b7896](boot #{pane_boot_count}),} ,#{?pane_active,#[fg=#7aa2ff]#[bg=#7aa2ff fg=#0a0a0a bold] #{pane_current_command}#[bg=#0a0a0a fg=#7aa2ff nobold]#[fg=#6b7896]   #{b:pane_current_path} ,#[fg=#6b7896]  #{pane_current_command}    #{b:pane_current_path} }}#[default]"

# Thin scrollbar that only appears while scrolling.
setw -g pane-scrollbars auto-hide
setw -g pane-scrollbars-style "bg=#0a0a0a,fg=#3a3a3a,width=1,pad=0"

# ------------------------------------------------ prompts, menus, modes
set -g message-style "bg=#1a1a1a,fg=#c3a6ff,bold"
set -g message-command-style "bg=#1a1a1a,fg=#7aa2ff"
setw -g mode-style "bg=#303030,fg=#d6deeb"
set -g menu-border-lines rounded
set -g menu-style "bg=#1a1a1a,fg=#d6deeb"
set -g menu-selected-style "bg=#7aa2ff,fg=#0a0a0a,bold"
set -g menu-border-style "fg=#333333,bg=#1a1a1a"

# ------------------------------------------------ handy, modern bindings
# Splits and new windows open in the current folder.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# prefix + C-c: new session, asking for its name (Enter alone = default).
bind C-c command-prompt -p "Session name:" { if -F "#{==:%%,}" { new-session } { new-session -s "%%" } }
# prefix + S: serial device menu.
bind S choose-serial

# Command palette: Alt+Space (no prefix needed), or prefix + P.
# (##{ keeps the format for command-prompt instead of expanding it early.)
bind -n M-Space display-menu -x C -y C -T "#[align=centre fg=#c3a6ff bold]   Command palette " \
  "New named session"   n { command-prompt -p "Session name:" { if -F "##{==:%%,}" { new-session } { new-session -s "%%" } } } \
  "Serial console"      s { choose-serial } \
  "Send break"          k { serial-break } \
  "Reconnect serial"    e { serial-reconnect } \
  "Toggle timestamps"   t { if -F "#{==:#{serial-timestamps},off}" { set -p serial-timestamps wallclock } { set -p serial-timestamps off } } \
  "Boot report"         o { boot-report -N 10 } \
  "Baud rate (#{serial-baud})" B { choose-serial -B } \
  "Switch session"      w { choose-tree -Zs } \
  "" \
  "Split right"         | { split-window -h -c "#{pane_current_path}" } \
  "Split down"          - { split-window -v -c "#{pane_current_path}" } \
  "New window"          c { new-window -c "#{pane_current_path}" } \
  "Zoom pane"           z { resize-pane -Z } \
  "" \
  "Rename window"       r { command-prompt -I "#W" { rename-window -- "%%" } } \
  "Rename session"      R { command-prompt -I "#S" { rename-session -- "%%" } } \
  "Show/hide Tabs panel" b { toggle-side-status } \
  "" \
  "Close pane"          x { kill-pane }
bind P send-keys -K M-Space

# Show/hide the Tabs panel (it slides in and out): prefix + b, the panel
# button on the bottom bar, or the palette. "set -g side-status-animation
# off" makes it instant.
bind b toggle-side-status

# ------------------------------------------------------ embedded / UART
# Serial panes are native (new-serial): scrollback, copy mode and search
# work, and they reconnect when the adapter is unplugged and plugged back.
# Devices can be named by USB properties so they survive re-enumeration:
#   bind U new-serial -h -l 45% vid=0403,pid=6001,serial=A50285BI
set -g serial-baud 115200
# set -g serial-log-dir ~/serial-logs   # one log per detected boot
# Stop U-Boot's autoboot automatically (send a space when it asks):
# set -g autoboot-interrupt " "

# Things worth knowing about immediately, in any pane.
set -g output-match[0] "panic:Kernel panic"
set -ga output-match "oops:Internal error: Oops"
set -ga output-match "bug:BUG: "
set -ga output-match "selinux:avc: +denied"
set -ga output-match "crash:Service .* crashed"
set-hook -g pane-output-match {
  display -d 4000 "#[fg=#f7768e,bold] #{hook_match_name} #[default]in #{pane_title}: #{=60:hook_match_line}"
}
# Note the end of each boot.
set-hook -g pane-boot-stage {
  if -F "#{==:#{hook_boot_stage},login}" { display -d 3000 "#{b:pane_serial_device}: boot #{hook_boot_count} up in #{pane_boot_elapsed}s" }
}

# Copy mode: open the file:line under the cursor in the editor
# (open-location-command, VS Code by default).
bind -T copy-mode-vi C-o send -X open-location
bind -T copy-mode M-o send -X open-location
# Container or Yocto build paths can be mapped to the local checkout:
# set -g open-location-rewrite[0] "^/workdir/=>/home/me/yocto/"

# Baud rate menu: prefix + B, the palette, or click the baud chip in the
# bottom bar. Default is 115200.
bind B choose-serial -B

# Clicks: a device opens/focuses its console, "New session" asks for a
# name, a session or window switches to it, the baud chip opens the baud
# menu and the menu button opens the command palette.
bind -n MouseDown1Status {
  if -F "#{m/r:^f[0-9]+$,#{mouse_status_range}}" {
    open-file -i "#{s/^f//:mouse_status_range}"
  } {
  if -F "#{m:@*,#{mouse_status_range}}" {
    choose-serial -d "#{s/^@//:mouse_status_range}"
  } {
    if -F "#{==:#{mouse_status_range},newsession}" { command-prompt -p "Session name:" { if -F "#{==:%%,}" { new-session } { new-session -s "%%" } } } {
    if -F "#{==:#{mouse_status_range},baud}" { choose-serial -B } {
      if -F "#{==:#{mouse_status_range},menu}" { send-keys -K M-Space } {
      if -F "#{==:#{mouse_status_range},panel}" { toggle-side-status } { switch-client -t= }
      }
    }
    }
  }
  }
}
